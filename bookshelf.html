<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hi i'm ananya.</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0a;
      color: #e8e8e8;
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.02) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.015) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 4rem 2rem;
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3rem;
      padding: 1rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      font-weight: 500;
      color: #fff;
      letter-spacing: 0.05em;
      position: relative;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .name::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 1px;
      background: #fff;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .name:hover::after {
      width: 100%;
    }

    .nav {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .nav a {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.5);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      padding: 0.25rem 0;
    }

    .nav a::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 1px;
      background: #fff;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .nav a:hover {
      color: #fff;
      transform: translateY(-2px);
    }

    .nav a:hover::before {
      width: 100%;
    }

    hr {
      display: none;
    }

    main {
      animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: center;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      font-size: 3rem;
      font-weight: 300;
      letter-spacing: -0.02em;
      color: rgba(255, 255, 255, 0.5);
      position: relative;
      animation: glitch 8s infinite, pulse 3s ease-in-out infinite;
    }

    @keyframes glitch {
      0%, 100% {
        transform: translate(0);
      }
      20% {
        transform: translate(-1px, 1px);
      }
      40% {
        transform: translate(-1px, -1px);
      }
      60% {
        transform: translate(1px, 1px);
      }
      80% {
        transform: translate(1px, -1px);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.5;
      }
      50% {
        opacity: 0.8;
      }
    }

    body > p {
      text-align: center;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.3);
      margin-top: 6rem;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.05em;
    }

    @media (max-width: 768px) {
      .container {
        padding: 2rem 1.5rem;
      }

      h2 {
        font-size: 2rem;
      }

      .nav {
        gap: 1rem;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="navbar">
     <a href="index.html" style="text-decoration: none;"><span class="name">/ananya dua</span></a>
      <nav class="nav">
        <a href="research.html">/research 🔬</a>
        <a href="portfolio.html">/portfolio 💻</a>
        <a href="travel.html">/travel ✈️</a>
      </nav>
    </header>
    <hr />
    <main>
      <h2>coming soon</h2>
    </main>
  </div>

  <p style="text-align: center; font-size: 0.9rem; color: #999; margin-top: 4em;">
  made with ☕️ and 🐛s.<br />© <span data-current-year>2026</span> ananya dua. all rights reserved.
</p>

<script src="index.js"></script>
</body>
</html>
